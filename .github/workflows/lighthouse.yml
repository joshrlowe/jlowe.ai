name: Lighthouse

on:
  pull_request:
    branches: [v2, main]
  push:
    branches: [v2]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: flat shell performance ≥ 95
    runs-on: ubuntu-latest # includes Google Chrome, which lhci launches
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        run: pnpm --filter @velocity/web build
      - name: Lighthouse CI (flat routes)
        run: pnpm exec lhci autorun
