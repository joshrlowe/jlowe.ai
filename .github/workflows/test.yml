# =============================================================================
# TEST SUITE WORKFLOW
# =============================================================================
# Comprehensive CI/CD pipeline for jlowe.ai portfolio
#
# Pipeline Flow:
#   lint ──┬──> build ──┬──> e2e-tests ──> e2e-report
#          │            ├──> lighthouse
#          │            ├──> visual-regression
#          │            ├──> accessibility
#          │            └──> performance
#          │
#          └──> unit-tests
#
#   security (runs in parallel, non-blocking)
#
# All jobs report to test-summary for final status
# =============================================================================

name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual triggers

# Cancel in-progress runs when a new one starts (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# GLOBAL ENVIRONMENT VARIABLES
# =============================================================================
env:
  NODE_VERSION: "20"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  NEXTAUTH_SECRET: test-secret-for-ci
  NEXTAUTH_URL: http://localhost:3000

jobs:
  # ===========================================================================
  # STAGE 1: CODE QUALITY CHECKS (runs first, fast feedback)
  # ===========================================================================

  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check for @ts-nocheck in source
        run: npm run lint:nocheck

      - name: Check formatting (if prettier is configured)
        run: |
          if grep -q "prettier" package.json; then
            npx prettier --check "**/*.{js,jsx,ts,tsx,json,css,md}"
          else
            echo "Prettier not configured, skipping"
          fi
        continue-on-error: true

  # ===========================================================================
  # STAGE 1: SECURITY SCANNING (runs in parallel, non-blocking)
  # ===========================================================================

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    # No dependencies - runs in parallel with lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ===========================================================================
  # STAGE 2: BUILD VERIFICATION (fail fast before expensive tests)
  # ===========================================================================

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}

      - name: Analyze bundle size
        run: |
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .next/build-manifest.json ]; then
            echo "### Build Manifest" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat .next/build-manifest.json | head -50 >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Page Sizes" >> $GITHUB_STEP_SUMMARY
          if [ -d .next/server/pages ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            du -sh .next/server/pages/* 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || echo "No pages found"
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Total Build Size" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          du -sh .next/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1

  # ===========================================================================
  # STAGE 2: UNIT & INTEGRATION TESTS (runs after lint, parallel with build)
  # ===========================================================================

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        # pgvector image: the schema declares a vector(1024) column, so plain
        # postgres:15 fails `prisma db push` with `type "vector" does not exist`.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Enable pgvector extension
        # `prisma db push` reads schema.prisma and ignores the migrations dir,
        # so the hand-written `CREATE EXTENSION vector` in the knowledge-chunks
        # migration never runs. The pgvector image ships the extension but does
        # not enable it — create it here so the vector(1024) column pushes.
        run: echo 'CREATE EXTENSION IF NOT EXISTS vector;' | npx prisma db execute --stdin --schema prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Setup database schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run unit & integration tests (coverage enforced)
        # jest 30 restored coverage instrumentation (ADR-0002, resolved
        # 2026-08-12); jest.config.js enforces the 70% global thresholds.
        run: npm run test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.DATABASE_URL }}

  # ===========================================================================
  # STAGE 2: MIGRATION DRIFT CHECK (replays committed migrations on a scratch
  # DB and asserts they produce the schema in schema.prisma — guards against
  # the db-push-in-prod drift documented in docs/decisions/0004)
  # ===========================================================================

  migration-drift:
    name: Migration Drift Check
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        # pgvector image: the knowledge-chunks migration creates the vector
        # extension and a vector(1024) column.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Replay migration history
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Assert migrations match schema.prisma
        # The knowledge-chunks migration creates two raw-SQL indexes (HNSW on
        # embedding, GIN on tsv) that schema.prisma cannot express, so the diff
        # always reports exactly those as "removed" — allowlist them and fail
        # on anything else: a real schema change shipped without a migration.
        run: |
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma > drift.txt || true
          grep -vE '^\s*$|No difference detected|Changed the `knowledge_chunks` table|Removed index on columns \((embedding|tsv)\)' drift.txt > real-drift.txt || true
          if [ -s real-drift.txt ]; then
            echo "::error::Schema drift not captured by migrations:"
            cat drift.txt
            exit 1
          fi
          echo "No drift beyond the allowlisted raw-SQL indexes:"
          cat drift.txt
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  # ===========================================================================
  # STAGE 3: LIGHTHOUSE CI (runs after build for performance auditing)
  # ===========================================================================

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        # pgvector image: the schema declares a vector(1024) column, so plain
        # postgres:15 fails `prisma db push` with `type "vector" does not exist`.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Enable pgvector extension
        # `prisma db push` reads schema.prisma and ignores the migrations dir,
        # so the hand-written `CREATE EXTENSION vector` in the knowledge-chunks
        # migration never runs. Create it here so the vector(1024) column pushes.
        run: echo 'CREATE EXTENSION IF NOT EXISTS vector;' | npx prisma db execute --stdin --schema prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Setup database schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed database with test data
        run: npm run seed:content || echo "Seed script not available, continuing..."
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        continue-on-error: true

      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: true
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 7
        continue-on-error: true

  # ===========================================================================
  # STAGE 3: E2E TESTS (Playwright - runs after build)
  # ===========================================================================

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        # pgvector image: the schema declares a vector(1024) column, so plain
        # postgres:15 fails `prisma db push` with `type "vector" does not exist`.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      fail-fast: false # Continue other browsers if one fails
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1/2, 2/2] # Split tests for faster execution

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Enable pgvector extension
        # `prisma db push` reads schema.prisma and ignores the migrations dir,
        # so the hand-written `CREATE EXTENSION vector` in the knowledge-chunks
        # migration never runs. Create it here so the vector(1024) column pushes.
        run: echo 'CREATE EXTENSION IF NOT EXISTS vector;' | npx prisma db execute --stdin --schema prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Setup database schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed database with test data
        run: npm run seed:content || echo "Seed script not available or failed, continuing..."
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        continue-on-error: true

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
        env:
          CI: true
          NODE_ENV: test
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 30

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}-${{ strategy.job-index }}
          path: test-results/**/*.png
          retention-days: 7

      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ matrix.browser }}-${{ strategy.job-index }}
          path: test-results/**/*.webm
          retention-days: 7

  # ===========================================================================
  # STAGE 4: MERGE E2E REPORTS
  # ===========================================================================

  e2e-report:
    name: Publish E2E Test Report
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: playwright-report-*

      - name: Merge reports
        run: |
          mkdir -p merged-report
          for dir in all-reports/playwright-report-*; do
            if [ -d "$dir" ]; then
              cp -r "$dir"/* merged-report/ 2>/dev/null || true
            fi
          done

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: merged-report/
          retention-days: 30

  # ===========================================================================
  # STAGE 3: VISUAL REGRESSION TESTS (runs after build)
  # ===========================================================================

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        # pgvector image: the schema declares a vector(1024) column, so plain
        # postgres:15 fails `prisma db push` with `type "vector" does not exist`.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Enable pgvector extension
        # `prisma db push` reads schema.prisma and ignores the migrations dir,
        # so the hand-written `CREATE EXTENSION vector` in the knowledge-chunks
        # migration never runs. Create it here so the vector(1024) column pushes.
        run: echo 'CREATE EXTENSION IF NOT EXISTS vector;' | npx prisma db execute --stdin --schema prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Setup database schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed database with test data
        run: npm run seed:content || echo "Seed script not available or failed, continuing..."
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        continue-on-error: true

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npx playwright test visual.spec.ts --project=chromium
        env:
          CI: true
          NODE_ENV: test
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/**/diff-*.png
          retention-days: 7

  # ===========================================================================
  # STAGE 3: ACCESSIBILITY TESTS (runs after build)
  # ===========================================================================

  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        # pgvector image: the schema declares a vector(1024) column, so plain
        # postgres:15 fails `prisma db push` with `type "vector" does not exist`.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
