        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Enable pgvector extension
        # `prisma db push` reads schema.prisma and ignores the migrations dir,
        # so the hand-written `CREATE EXTENSION vector` in the knowledge-chunks
        # migration never runs. Create it here so the vector(1024) column pushes.
        run: echo 'CREATE EXTENSION IF NOT EXISTS vector;' | npx prisma db execute --stdin --schema prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Setup database schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed database with test data
        run: npm run seed:content || echo "Seed script not available or failed, continuing..."
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        continue-on-error: true

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npx playwright test accessibility.spec.ts --project=chromium
        env:
          CI: true
          NODE_ENV: test
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: test-results/
          retention-days: 30

  # ===========================================================================
  # STAGE 3: PERFORMANCE TESTS (runs after build)
  # ===========================================================================

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        # pgvector image: the schema declares a vector(1024) column, so plain
        # postgres:15 fails `prisma db push` with `type "vector" does not exist`.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Enable pgvector extension
        # `prisma db push` reads schema.prisma and ignores the migrations dir,
        # so the hand-written `CREATE EXTENSION vector` in the knowledge-chunks
