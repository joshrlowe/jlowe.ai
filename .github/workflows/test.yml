          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: test-results/
          retention-days: 30

  # ===========================================================================
  # FINAL STAGE: TEST SUMMARY (aggregates all job results)
  # ===========================================================================

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        security,
        build,
        lighthouse,
        unit-tests,
        e2e-tests,
        visual-regression,
        accessibility,
        performance,
      ]
    if: always()

    steps:
      - name: Generate test summary
        run: |
          echo "## 🧪 Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse | ${{ needs.lighthouse.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Visual Regression | ${{ needs.visual-regression.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility | ${{ needs.accessibility.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.performance.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any critical test failed
        # != 'success' (not == 'failure') so cancelled/skipped upstream jobs
        # can't slip through the gate as green.
        if: |
          needs.lint.result != 'success' ||
          needs.build.result != 'success' ||
          needs.lighthouse.result != 'success' ||
          needs.unit-tests.result != 'success' ||
          needs.e2e-tests.result != 'success' ||
          needs.visual-regression.result != 'success' ||
          needs.accessibility.result != 'success' ||
          needs.performance.result != 'success'
        run: exit 1

      - name: Warn if security scan failed
        if: needs.security.result == 'failure'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Security scan reported issues** - please review the security job logs" >> $GITHUB_STEP_SUMMARY
