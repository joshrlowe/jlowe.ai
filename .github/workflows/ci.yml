name: CI

on:
  pull_request:
    branches: [v2, main]
  push:
    branches: [v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9 — version resolved from packageManager field

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Corpus up-to-date
        run: pnpm corpus && git diff --exit-code apps/web/src/data/corpus.generated.ts services/chat/src/system-prompt.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build (static export)
        run: pnpm build

      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Asset guard
        run: node scripts/check-assets.mjs
