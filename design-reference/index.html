<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&display=swap" />

  <link rel="stylesheet" href="src/tokens.css?v=9" />
</head>
<body>
  <!-- WebGL scene -->
  <div id="supernova-canvas" style="position: fixed; inset: 0; z-index: 0; pointer-events: none;"></div>

  <!-- Subtle noise for depth -->
  <div class="noise"></div>

  <!-- React app -->
  <div id="react-root"></div>

  <!-- Content-gate: wait for supernova detonation before revealing page -->
  <script>
    (function() {
      var root = document.getElementById('react-root');
      var fallback = setTimeout(function() { if (root) root.classList.add('intro-ready'); }, 5000);
      // Trigger reveal a touch after detonation so debris has filled the screen
      window.addEventListener('supernova:detonate', function() {
        setTimeout(function() {
          if (root) root.classList.add('intro-ready');
          clearTimeout(fallback);
        }, 350);
      });
      // Reduced motion / disabled intro: reveal immediately if 'complete' fires without 'detonate' delay
      window.addEventListener('supernova:complete', function() {
        if (root) root.classList.add('intro-ready');
        clearTimeout(fallback);
      });
    })();
  </script>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="src/supernova.js?v=10"></script>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data first -->
  <script src="src/data.js?v=4"></script>
  <!-- Components -->
  <script type="text/babel" src="src/tweaks-panel.jsx?v=4"></script>
  <script type="text/babel" src="src/chrome.jsx?v=4"></script>
  <script type="text/babel" src="src/hero-about.jsx?v=4"></script>
  <script type="text/babel" src="src/sections.jsx?v=5"></script>
  <script type="text/babel" src="src/app.jsx?v=4"></script>
</body>
</html>
